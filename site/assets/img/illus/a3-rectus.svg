<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="腹壁整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">腹直肌分离：正常 vs 分离</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,140)"><rect width="1080" height="300" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="30" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#0a6cb8">正常</text><path d="M 180 110 Q 400 60 620 110 L 620 240 Q 400 290 180 240 Q 150 180 180 110 Z" fill="#f6c9b8" opacity=".45" stroke="#0a6cb8" stroke-width="3"/><rect x="372" y="128" width="14" height="96" rx="7" fill="#0a6cb8" opacity=".85"/><text x="430" y="185" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#5a6c7c">腹白线紧</text><text x="760" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#d4a437">分离</text><path d="M 700 110 Q 900 60 1050 110 L 1050 240 Q 900 290 700 240 Q 680 180 700 110 Z" fill="#f6c9b8" opacity=".3" stroke="#c97f63" stroke-width="3" stroke-dasharray="7 6"/><rect x="830" y="140" width="44" height="80" rx="10" fill="#f0c05a" opacity=".5"/><text x="890" y="185" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#a05b46">腹白线增宽</text></g><text x="600" y="492" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">平躺抬头时中间凹陷或隆起更明显，可自查但要医生查体确认</text></svg>