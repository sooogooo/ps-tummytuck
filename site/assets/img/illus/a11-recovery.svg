<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="腹壁整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">术后恢复时间线</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,150)"><rect width="500" height="330" rx="16" fill="#fff" stroke="#d6e1ea"/><line x1="90" y1="40" x2="90" y2="300" stroke="#0a6cb8" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="50" r="12" fill="#0a6cb8"/><text x="115" y="48" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">第1周</text><text x="115" y="68" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">卧床休息·引流管</text><circle cx="90" cy="120" r="12" fill="#0a6cb8"/><text x="115" y="118" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">第2-4周</text><text x="115" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">逐步活动·束腹带</text><circle cx="90" cy="190" r="12" fill="#0a6cb8"/><text x="115" y="188" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">第4-6周</text><text x="115" y="208" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">正常生活·免剧烈</text><circle cx="90" cy="260" r="12" fill="#0a6cb8"/><text x="115" y="258" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#1c2b39">6周-3月</text><text x="115" y="278" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#5a6c7c">瘢痕成熟·轮廓稳</text></g><g transform="translate(640,150)"><rect width="500" height="330" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="26" y="46" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#d4a437">恢复快慢因人而异</text><text x="26" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5a6c7c">吸烟、糖尿病、年龄、手术范围</text><text x="26" y="136" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5a6c7c">会影响恢复速度与瘢痕</text><rect x="26" y="180" width="440" height="70" rx="12" fill="#fff7ea" stroke="#f0c05a"/><text x="46" y="228" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#8a6d1c">恢复期是阶段性的，不能"几天就好"</text></g><text x="600" y="500" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">管理预期，把恢复期分成阶段看</text></svg>