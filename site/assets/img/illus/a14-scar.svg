<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="腹壁整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">瘢痕成熟的过程</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,160)"><rect width="1080" height="260" rx="16" fill="#fff" stroke="#d6e1ea"/><line x1="60" y1="150" x2="1100" y2="150" stroke="#d6e1ea" stroke-width="3"/><circle cx="80" cy="150" r="11" fill="#d4a437"/><text x="80" y="120" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#1c2b39">1月</text><text x="80" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a6c7c">发红隆起</text><circle cx="340" cy="150" r="11" fill="#d4a437"/><text x="340" y="120" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#1c2b39">3月</text><text x="340" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a6c7c">高峰</text><circle cx="600" cy="150" r="11" fill="#4a9fd4"/><text x="600" y="120" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#1c2b39">6月</text><text x="600" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a6c7c">开始软化</text><circle cx="860" cy="150" r="11" fill="#0a6cb8"/><text x="860" y="120" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#1c2b39">9-12月</text><text x="860" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#5a6c7c">变平褪色</text></g><text x="600" y="470" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">瘢痕成熟需数月，减张、硅胶、防晒有帮助，不能拆线就定论</text></svg>