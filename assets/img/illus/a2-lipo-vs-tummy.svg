<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="腹壁整形插图"><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a6cb8"/><stop offset="100%" stop-color="#7ec3eb"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a437"/><stop offset="100%" stop-color="#e8c068"/></linearGradient></defs><rect width="1200" height="520" fill="#f4f9fc"/><text x="40" y="64" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#1c2b39">腹壁整形 vs 吸脂：对象不同</text><rect x="40" y="80" width="120" height="6" rx="3" fill="url(#blue)"/><g transform="translate(60,140)"><rect width="500" height="300" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="18" y="36" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#0a6cb8">吸脂</text><rect x="40" y="70" width="130" height="76" rx="12" fill="#f5d98e"/><text x="105" y="116" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#8a6d1c">脂肪</text><text x="200" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">主要针对皮下脂肪</text><text x="200" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">不适于皮肤松弛</text><text x="40" y="220" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">小切口 · 恢复相对短</text></g><g transform="translate(640,140)"><rect width="500" height="300" rx="16" fill="#fff" stroke="#d6e1ea"/><text x="18" y="36" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#d4a437">腹壁整形</text><rect x="40" y="70" width="130" height="76" rx="12" fill="#f6c9b8"/><text x="105" y="102" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#a05b46">皮肤</text><text x="105" y="128" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a05b46">腹直肌</text><text x="200" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">解决皮肤松弛 + 腹直肌</text><text x="200" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#5a6c7c">伴更长切口与恢复期</text><text x="40" y="220" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">较长下腹切口 · 明显瘢痕</text></g><text x="600" y="492" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#7a8a98">选错方向是术后不满意最常见的原因</text></svg>